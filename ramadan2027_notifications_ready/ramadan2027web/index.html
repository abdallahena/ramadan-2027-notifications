function renderDraftQuestionFields(){
  const d=window.__draftQuestion.q,type=document.getElementById('dqType').value,f=document.getElementById('dqFields'); let extra='';
  if(type==='mcq'){const opts=d.options?.length?d.options:['',''];extra=`<div class="lbl">الخيارات والإجابة الصحيحة</div>${opts.map((o,i)=>`<div class="row" style="margin:6px 0"><input type="radio" name="dqCorrect" value="${i}" ${d.correctIndex===i?'checked':''}><input class="grow dqOpt" value="${esc(o||'')}" placeholder="خيار ${i+1}"></div>`).join('')}<button class="btn sm secondary" type="button" onclick="addDraftOption()">+ خيار</button>`;}
  else if(type==='tf') extra=`<div class="lbl">الإجابة الصحيحة</div><label class="field"><input type="radio" name="dqCorrect" value="0" ${d.correctIndex===0?'checked':''}> صح</label><label class="field"><input type="radio" name="dqCorrect" value="1" ${d.correctIndex===1?'checked':''}> خطأ</label>`;
  f.innerHTML=`<label class="field"><span class="lbl">نص السؤال</span><textarea id="dqText" rows="4">${esc(d.text||'')}</textarea></label>${extra}<label class="field"><span class="lbl">الإجابة النموذجية</span><textarea id="dqModel" rows="3">${esc(d.modelAnswer||'')}</textarea></label><label class="field"><span class="lbl">النقاط</span><input id="dqPoints" type="number" min="0" value="${d.points??1}"></label>`;
}
function addDraftOption(){const d=window.__draftQuestion.q;d.options=[...document.querySelectorAll('.dqOpt')].map(x=>x.value);d.options.push('');renderDraftQuestionFields();}
function saveDraftQuestion(){
  const d=window.__draftQuestion.q,type=document.getElementById('dqType').value;d.type=type;d.text=document.getElementById('dqText').value.trim();d.modelAnswer=document.getElementById('dqModel').value.trim();d.points=Math.max(0,+document.getElementById('dqPoints').value||0);d.options=[];d.correctIndex=null;
  const sel=document.querySelector('input[name="dqCorrect"]:checked');
  if(type==='mcq'){d.options=[...document.querySelectorAll('.dqOpt')].map(x=>x.value.trim()).filter(Boolean);if(d.options.length<2||!sel||+sel.value>=d.options.length){toast('أدخل خيارين وحدد الإجابة الصحيحة','err');return;}d.correctIndex=+sel.value;}
  if(type==='tf'){d.options=['صح','خطأ'];if(!sel){toast('حدد الإجابة الصحيحة','err');return;}d.correctIndex=+sel.value;}
  if(!d.text){toast('نص السؤال مطلوب','err');return;}
  const draft=window.__challengeDraft;if(window.__draftQuestion.idx==null)draft.questions.push(d);else draft.questions[window.__draftQuestion.idx]=d;renderChallengeModal();
}
async function saveChallenge(){

  const c={id:uid(),title,description:document.getElementById('chDesc').value.trim(),startAt:a?new Date(a).toISOString():null,endAt:b?new Date(b).toISOString():null,timeLimitSeconds:+document.getElementById('chTime').value||30,questions:window.__challengeDraft.questions||[],published:true,submissions:{}};

function gradeChallengeSubmission(id,username){
  const c=DB.challenges[id], s=c.submissions[username];

async function confirmChallengeGrade(id,username){
  const c=DB.challenges[id], s=c.submissions[username]; let total=0; s.grades={};
  document.querySelectorAll('.chGrade').forEach(i=>{const q=c.questions.find(q=>q.id===i.dataset.qid);const v=Math.max(0,Math.min(q.points,+i.value||0));s.grades[q.id]={points:v};total+=v;});
  s.total=total;s.status='graded';s.gradedAt=nowISO();s.gradedBy=CURRENT.username;

  queuePush([username],'✅ تم اعتماد نتيجة التحدي',`حصلت على ${total} نقطة في "${c.title}".`,'#/challenges','challenge_graded');
  closeModal();render();
}

  for(const r of rounds.sort((a,b)=>a.round-b.round)){

async function confirmTieBreakGrade(g,round,username){const C=ensureCompetitionGroupsV4(),r=(C.tieBreaks[g]||[]).find(x=>x.round===round),s=r.submissions[username];let total=0,grades={};document.querySelectorAll('.tieGrade').forEach(inp=>{const q=r.questions.find(x=>x.id===inp.dataset.qid),v=Math.max(0,Math.min(q?.points||0,+inp.value||0));grades[q.id]={points:v};total+=v;});s.grades=grades;s.total=total;s.status='graded';s.gradedAt=nowISO();s.gradedBy=CURRENT.username;await persist('competition');audit('grade_competition_tiebreak',null,{group:g,round,username,total});queuePush([username],'⚖️ تم اعتماد نتيجة كسر التعادل',`حصلت على ${total} نقطة في الجولة ${round}.`,'#/competition','competition_tie_graded');closeModal();render();}
function ensureCompetitionGroupsV4(){
  const C=ensureCompetitionConfig(); C.groups=C.groups||{};
  ['first','second','third'].forEach(g=>{
    const x=C.groups[g]=C.groups[g]||{}; x.participants=x.participants||[];
    if(!Array.isArray(x.stages)){
      const old=Array.isArray(C.stages)?C.stages:[];
      x.stageCount=Math.max(1,Math.min(3,+(x.stageCount||C.stageCount||old.length||3)));
      x.stages=[];
      for(let i=0;i<x.stageCount;i++){
        const o=old[i]||{};
        x.stages[i]={id:'g'+g+'s'+(i+1),name:o.name||('المرحلة '+(i+1)),enabled:o.enabled!==false,startAt:o.startAt||null,endAt:o.endAt||null,timeLimitSeconds:+(o.timeLimitSeconds||0),questions:(o.questions&&o.questions[g])?o.questions[g]:[]};
      }
    } else {
      x.stageCount=Math.max(1,Math.min(3,+(x.stageCount||x.stages.length||1)));
      x.stages=x.stages.slice(0,x.stageCount);
      while(x.stages.length<x.stageCount)x.stages.push({id:'g'+g+'s'+(x.stages.length+1),name:'المرحلة '+(x.stages.length+1),enabled:true,startAt:null,endAt:null,timeLimitSeconds:0,questions:[]});
      x.stages.forEach(st=>st.questions=Array.isArray(st.questions)?st.questions:[]);
    }
  });
  return C;
}

function competitionSubmissionsForGroup(g){

  });

}

  </details>`}).join('')}</div>`;
}
async function setCompetitionGroupStageCount(g,v){const C=ensureCompetitionGroupsV4(),x=C.groups[g];x.stageCount=Math.max(1,Math.min(3,+v||1));while(x.stages.length<x.stageCount)x.stages.push({id:'g'+g+'s'+(x.stages.length+1),name:'المرحلة '+(x.stages.length+1),enabled:true,startAt:null,endAt:null,timeLimitSeconds:0,questions:[]});x.stages=x.stages.slice(0,x.stageCount);await persist('competition');render();}
function openCompetitionQuestionModalV4(g,n,idx){
  const C=ensureCompetitionGroupsV4(),c=C.groups[g].stages[n-1],q=idx!=null?(c.questions||[])[idx]:null;
  window.__compQ={group:g,stageNo:n,idx:idx!=null?idx:null,image:q?.image||'',_question:q||null};
  const qq=q||{id:uid(),type:'mcq',text:'',options:['','',''],correctIndex:null,points:1,modelAnswer:'',image:''};
  const slot=document.getElementById('modalSlot')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'modalSlot'}));
  slot.innerHTML=`<div class="modal-bg"><div class="modal" style="max-width:760px"><h3>${q?'تعديل سؤال':'إضافة سؤال'} — ${esc(C.groups[g].name)} / ${esc(c.name)}</h3>
    <label class="field"><span class="lbl">نوع السؤال</span><select id="cqTypeV4" onchange="renderCompetitionQuestionFieldsV4()">${['mcq','tf','short','essay'].map(x=>`<option value="${x}" ${qq.type===x?'selected':''}>${qTypeLabel(x)}</option>`).join('')}</select></label>
    <div id="cqFieldsV4"></div><div class="row" style="gap:8px"><button class="btn secondary grow" onclick="closeModal()">إلغاء</button><button class="btn grow" onclick="saveCompetitionQuestionV4()">حفظ السؤال</button></div>
  </div></div>`;
  renderCompetitionQuestionFieldsV4(qq);
}
function renderCompetitionQuestionFieldsV4(q){
  const type=document.getElementById('cqTypeV4')?.value||'mcq',f=document.getElementById('cqFieldsV4');if(!f)return;
  const opts=q?.options&&q.options.length?q.options:['','','']; let extra='';
  if(type==='mcq') extra=`<div class="lbl" style="margin-bottom:6px">الخيارات والإجابة الصحيحة</div>${opts.map((o,i)=>`<div class="row" style="margin-bottom:6px"><input type="radio" name="cqCorrectRadio" value="${i}" ${q?.correctIndex===i?'checked':''}><input type="text" class="grow cqOptV4" value="${esc(o||'')}" placeholder="خيار ${i+1}"></div>`).join('')}<button type="button" class="btn sm secondary" onclick="addCompetitionMcqOptionV4()">+ خيار</button>`;
  else if(type==='tf') extra=`<div class="lbl" style="margin-bottom:6px">الإجابة الصحيحة</div><label class="field"><input type="radio" name="cqCorrectRadio" value="0" ${q?.correctIndex===0?'checked':''}> صح</label><label class="field"><input type="radio" name="cqCorrectRadio" value="1" ${q?.correctIndex===1?'checked':''}> خطأ</label>`;
  else extra=`<div class="small muted" style="margin-bottom:10px">هذا النوع يُصحَّح يدويًا بالكامل بالاستناد إلى الإجابة النموذجية.</div>`;
  f.innerHTML=`<label class="field"><span class="lbl">نص السؤال</span><textarea id="cqTextV4" rows="3">${esc(q?.text||'')}</textarea></label>${extra}<label class="field"><span class="lbl">الإجابة النموذجية <span style="color:var(--rose-lite)">* مطلوبة</span></span><textarea id="cqModelV4" rows="2">${esc(q?.modelAnswer||'')}</textarea></label><label class="field"><span class="lbl">النقاط</span><input id="cqPointsV4" type="number" min="0" value="${q?.points??1}"></label><label class="field"><span class="lbl">صورة (اختياري)</span><input type="file" accept="image/*" onchange="previewCompetitionQuestionImageV4(event)"><div id="cqImagePreviewV4">${q?.image?`<img src="${esc(q.image)}" style="max-width:100%;max-height:180px;border-radius:12px">`:''}</div></label>`;
}
function addCompetitionMcqOptionV4(){const vals=[...document.querySelectorAll('.cqOptV4')].map(i=>i.value);vals.push('');window.__compQ._question={...(window.__compQ._question||{}),type:'mcq',options:vals};renderCompetitionQuestionFieldsV4(window.__compQ._question);}
async function previewCompetitionQuestionImageV4(ev){const f=ev.target.files?.[0];if(!f)return;window.__compQ.image=await imageToDataURL(f,900,.78);document.getElementById('cqImagePreviewV4').innerHTML=`<img src="${esc(window.__compQ.image)}" style="max-width:100%;max-height:180px;border-radius:12px">`;}
async function saveCompetitionQuestionV4(){
  const x=window.__compQ,C=ensureCompetitionGroupsV4(),c=C.groups[x.group].stages[x.stageNo-1],type=document.getElementById('cqTypeV4').value,text=document.getElementById('cqTextV4').value.trim(),points=Math.max(0,+document.getElementById('cqPointsV4').value||0),modelAnswer=document.getElementById('cqModelV4').value.trim();
  if(!text){toast('نص السؤال مطلوب','err');return;}if(!modelAnswer){toast('الإجابة النموذجية مطلوبة','err');return;}
  let options=[],correctIndex=null;const sel=document.querySelector('input[name="cqCorrectRadio"]:checked');
  if(type==='tf'){options=['صح','خطأ'];correctIndex=sel?+sel.value:null;if(correctIndex===null){toast('حدد الإجابة الصحيحة','err');return;}}
  if(type==='mcq'){options=[...document.querySelectorAll('.cqOptV4')].map(i=>i.value.trim()).filter(Boolean);correctIndex=sel?+sel.value:null;if(options.length<2){toast('أدخل خيارين على الأقل','err');return;}if(correctIndex===null||correctIndex>=options.length){toast('حدد الإجابة الصحيحة','err');return;}}
  const old=x.idx!=null?c.questions[x.idx]:null;const q={id:old?.id||uid(),type,text,options,correctIndex,points,modelAnswer,image:x.image||old?.image||''};c.questions=c.questions||[];if(x.idx!=null)c.questions[x.idx]=q;else c.questions.push(q);
  await persist('competition');audit('save_competition_question_v4',null,{group:x.group,stage:x.stageNo,questionId:q.id,type});closeModal();render();
}
async function deleteCompetitionQuestionV4(g,n,i){if(!confirm('حذف هذا السؤال؟'))return;const C=ensureCompetitionGroupsV4();C.groups[g].stages[n-1].questions.splice(i,1);await persist('competition');render();}
async function toggleCompetitionStageV4(g,n){const C=ensureCompetitionGroupsV4(),c=C.groups[g].stages[n-1];if(!c)return;c.enabled=c.enabled===false;await persist('competition');audit(c.enabled?'enable_competition_stage':'pause_competition_stage',null,{group:g,stage:n,enabled:c.enabled});const users=C.groups[g].participants||[];if(users.length)queuePush(users,c.enabled?'🚀 تم تفعيل المرحلة':'⏸️ تم إيقاف المرحلة مؤقتًا',c.enabled?`${c.name} أصبحت متاحة الآن.`:`${c.name} متوقفة مؤقتًا بقرار الإدارة.`,'#/competition',c.enabled?'competition_stage_start':'competition_stage_paused');toast(c.enabled?'تم تفعيل المرحلة':'تم إيقاف المرحلة مؤقتًا','ok');render();}
async function saveCompetitionStageV4(g,n){const C=ensureCompetitionGroupsV4(),c=C.groups[g].stages[n-1];c.name=document.getElementById(`v4_name_${g}_${n}`).value.trim()||`المرحلة ${n}`;c.timeLimitSeconds=Math.max(0,+document.getElementById(`v4_time_${g}_${n}`).value||0);const a=document.getElementById(`v4_start_${g}_${n}`).value,b=document.getElementById(`v4_end_${g}_${n}`).value;c.startAt=a?new Date(a).toISOString():null;c.endAt=b?new Date(b).toISOString():null;await persist('competition');toast('تم حفظ المرحلة وأسئلتها للمجموعة','ok');render();}
async function saveFinalCompetitionTiming(){const C=ensureCompetitionGroupsV4(),a=document.getElementById('fcStart').value,b=document.getElementById('fcEnd').value;C.startAt=a?new Date(a).toISOString():null;C.endAt=b?new Date(b).toISOString():null;await persist('competition');toast('تم حفظ موعد المنافسة','ok');render();}
/* Bazaar settings are normalized and a live listener forces immediate UI refresh when status changes. */
let __V4_BAZ=null;setInterval(()=>{if(!DB||!CURRENT)return;const s=bazaarStatus();if(s!==__V4_BAZ){__V4_BAZ=s;if(!document.querySelector('.modal-bg')&&!PLAY_STATE&&!COMP_PLAY_STATE)render();}},1000);
ensureCompetitionGroupsV4();
</script>
</body>
